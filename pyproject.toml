[project]
name = "optibench"
version = "0.1.0"
description = "Test functions for optimisation algorithms, from the SFU Virtual Library of Simulation Experiments"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "jmdm", email = "jacopo.michele.dimatteo@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numba>=0.68.0",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "sympy>=1.14,<1.15",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coco-experiment>=2.8.2",
    "hypothesis>=6.170.8",
    "ipykernel>=7.4.0",
    "mypy>=2.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pillow>=13.0.0",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "ty>=0.0.91",
]
